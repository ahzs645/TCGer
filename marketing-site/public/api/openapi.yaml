openapi: 3.0.3
info:
  title: TCGer API
  description: >-
    REST API for TCGer. Browser clients use this Express API; they must not call
    Convex HTTP routes or supply internal X-TCGER-* bridge headers. The /auth/*
    namespace proxies Better Auth (https://www.better-auth.com).
  version: 0.1.0

servers:
  - url: /api
    description: Docker gateway / reverse-proxy path
  - url: /
    description: Direct backend service (no API prefix)
  - url: http://localhost:3004
    description: Local backend example port

security: []

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: >-
      Better Auth proxy and initial setup. /auth/* is forwarded to Better Auth
      in Convex; see https://www.better-auth.com for the complete generated API.
  - name: Cards
    description: Card search and details
  - name: Scanner
    description: Card scanner endpoints (Pokémon, Magic, and Yu-Gi-Oh only)
  - name: Collections
    description: Binder and card collection management (requires auth)
  - name: Wishlists
    description: Wishlist management with collection completion tracking (requires auth)
  - name: Users
    description: User profile and preferences (requires auth)
  - name: Settings
    description: Application settings
  - name: Decks
    description: Deck construction, import, validation, and analysis
  - name: Finance
    description: Purchase, sale, and trade transaction ledger
  - name: Sealed
    description: Sealed products, inventory, and opening ledger
  - name: Analytics
    description: Collection value and distribution analytics
  - name: Trades
    description: User trades and wishlist matches
  - name: Public
    description: Publicly shared collection views
  - name: News
    description: Public TCG news feed
  - name: Legacy availability
    description: Legacy route groups that return 501 when BACKEND_MODE is convex

paths:
  /cards/scan:
    post:
      tags: [Scanner]
      summary: Identify a card image
      description: Scanner support is intentionally limited to Pokémon, Magic, and Yu-Gi-Oh.
      operationId: scanCard
      parameters:
        - name: tcg
          in: query
          schema:
            $ref: "#/components/schemas/ScannerTcgCode"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Scan result
        "400":
          description: Invalid image or unsupported scanner TCG
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Health ──────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: getHealth
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  env:
                    type: string
                    example: development
                  mode:
                    type: string
                    enum: [hybrid, convex]
                  features:
                    $ref: "#/components/schemas/ServerFeatures"

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      operationId: getReadiness
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready

  # ─── Auth ────────────────────────────────────────────────────────────
  /auth/sign-up/email:
    post:
      tags: [Auth]
      summary: Sign up with email and username
      description: >-
        Better Auth email/password sign-up with the username plugin configured
        in convex-backend/convex/betterAuth/auth.ts.
      operationId: signUpEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetterAuthSignUpInput"
      responses:
        "200":
          description: Account and Better Auth session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/sign-in/username:
    post:
      tags: [Auth]
      summary: Sign in with username
      description: Better Auth username-plugin sign-in returning an opaque session token.
      operationId: signInUsername
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetterAuthUsernameSignInInput"
      responses:
        "200":
          description: Better Auth session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /auth/get-session:
    get:
      tags: [Auth]
      summary: Get the current Better Auth session
      operationId: getSession
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Current session, or null when unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthSessionResponse"

  /auth/sign-out:
    post:
      tags: [Auth]
      summary: End the current Better Auth session
      operationId: signOut
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Session ended

  /setup/setup-required:
    get:
      tags: [Auth]
      summary: Check if initial admin setup is needed
      operationId: checkSetupRequired
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupCheckResponse"

  /setup/setup:
    post:
      tags: [Auth]
      summary: Promote the authenticated user to initial admin
      description: >-
        After signing up through Better Auth, call this endpoint with that
        session. The request has no body. It returns 409 if an admin exists.
      operationId: setupAdmin
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Current user promoted to admin
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Admin account configured successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: An admin user already exists

  # ─── Cards ───────────────────────────────────────────────────────────
  /cards/search:
    get:
      tags: [Cards]
      summary: Search cards across all TCGs
      operationId: searchCards
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: tcg
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TcgCode"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: "#/components/schemas/Card"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationError"

  /cards/search/all:
    get:
      tags: [Cards]
      summary: Exhaustive name search — every printing matching a name
      description: >
        Unlike `/cards/search`, which returns a capped preview page, this pages
        through the provider for every match. Used to expand wishlist rules such
        as "every Darkrai". `limit` applies per game, so an all-games search can
        return up to `limit × games` cards.
      operationId: searchAllCards
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: tcg
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TcgCode"
        - name: unique
          in: query
          required: false
          description: >
            `prints` returns every printing of every matching card; `cards`
            collapses them to one entry per distinct card.
          schema:
            type: string
            enum: [prints, cards]
            default: prints
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: Every matching card, up to the limit
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: "#/components/schemas/Card"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationError"

  /cards/search/artist:
    get:
      tags: [Cards]
      summary: Find every card credited to an illustrator
      operationId: searchCardsByArtist
      security:
        - bearerAuth: []
      parameters:
        - name: artist
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: tcg
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TcgCode", default: pokemon }
        - name: unique
          in: query
          schema: { type: string, enum: [prints, cards], default: prints }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        "200":
          description: Exact provider illustrator matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Card" },
                    }
                  total: { type: integer }

  /cards/{tcg}/{cardId}:
    get:
      tags: [Cards]
      summary: Get a single card by TCG and ID
      operationId: getCard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tcg"
        - $ref: "#/components/parameters/cardId"
      responses:
        "200":
          description: Card detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  card:
                    $ref: "#/components/schemas/Card"
        "404":
          $ref: "#/components/responses/NotFound"

  /cards/{tcg}/{cardId}/prints:
    get:
      tags: [Cards]
      summary: Get all prints of a card
      operationId: getCardPrints
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/tcg"
        - $ref: "#/components/parameters/cardId"
      responses:
        "200":
          description: Card prints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPrintsResponse"

  # ─── Collections ─────────────────────────────────────────────────────
  /collections:
    get:
      tags: [Collections]
      summary: List all binders for the authenticated user
      operationId: getBinders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of binders with cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Binder"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Collections]
      summary: Create a new binder
      operationId: createBinder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBinderInput"
      responses:
        "201":
          description: Binder created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Binder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /collections/{binderId}:
    get:
      tags: [Collections]
      summary: Get a single binder
      operationId: getBinder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/binderId"
      responses:
        "200":
          description: Binder detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Binder"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Collections]
      summary: Update a binder
      operationId: updateBinder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/binderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBinderInput"
      responses:
        "200":
          description: Updated binder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Binder"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Collections]
      summary: Delete a binder
      operationId: deleteBinder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/binderId"
      responses:
        "204":
          description: Binder deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/tags:
    get:
      tags: [Collections]
      summary: List all tags for the authenticated user
      operationId: getTags
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectionTagResponse"
    post:
      tags: [Collections]
      summary: Create a new tag
      operationId: createTag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagInput"
      responses:
        "201":
          description: Tag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionTagResponse"

  /collections/cards:
    post:
      tags: [Collections]
      summary: Add a card to the library (no binder)
      operationId: addCardToLibrary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCardInput"
      responses:
        "201":
          description: Card added to library
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /collections/{binderId}/cards:
    post:
      tags: [Collections]
      summary: Add a card to a binder
      operationId: addCardToBinder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/binderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCardInput"
      responses:
        "201":
          description: Card added
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{binderId}/cards/{collectionId}:
    patch:
      tags: [Collections]
      summary: Update a card in a binder
      operationId: updateCollectionCard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/binderId"
        - $ref: "#/components/parameters/collectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardInput"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionCard"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Collections]
      summary: Remove a card from a binder
      operationId: removeCardFromBinder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/binderId"
        - $ref: "#/components/parameters/collectionId"
      responses:
        "204":
          description: Card removed
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Wishlists ──────────────────────────────────────────────────────
  /wishlists:
    get:
      tags: [Wishlists]
      summary: List all wishlists for the authenticated user
      operationId: getWishlists
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of wishlists with completion data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WishlistResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Wishlists]
      summary: Create a new wishlist
      operationId: createWishlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWishlistInput"
      responses:
        "201":
          description: Wishlist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wishlists/{wishlistId}:
    get:
      tags: [Wishlists]
      summary: Get a single wishlist with all cards and completion status
      operationId: getWishlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/wishlistId"
      responses:
        "200":
          description: Wishlist detail with cards and ownership info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Wishlists]
      summary: Update a wishlist
      operationId: updateWishlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/wishlistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWishlistInput"
      responses:
        "200":
          description: Updated wishlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Wishlists]
      summary: Delete a wishlist
      operationId: deleteWishlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/wishlistId"
      responses:
        "204":
          description: Wishlist deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /wishlists/{wishlistId}/cards:
    post:
      tags: [Wishlists]
      summary: Add a card to a wishlist
      operationId: addCardToWishlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/wishlistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWishlistCardInput"
      responses:
        "201":
          description: Card added to wishlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistCardResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /wishlists/{wishlistId}/cards/{wishlistCardId}:
    delete:
      tags: [Wishlists]
      summary: Remove a card from a wishlist
      operationId: removeCardFromWishlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/wishlistId"
        - name: wishlistCardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Card removed from wishlist
        "404":
          $ref: "#/components/responses/NotFound"

  /wishlists/{wishlistId}/rules:
    post:
      tags: [Wishlists]
      summary: Add (or refresh) an expansion rule on a wishlist
      description: >
        Rules describe the cards a wishlist wants in the abstract — "every
        Darkrai in Pokémon", "everything in Prismatic Evolutions". Posting a
        rule that already exists refreshes it instead of duplicating it.
        Expansion happens client-side: fetch matches from `/cards/search/all`
        or `/cards/sets/{tcg}/{setCode}`, then POST them to
        `/wishlists/{wishlistId}/cards/batch`.
      operationId: addWishlistRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/wishlistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWishlistRuleInput"
      responses:
        "201":
          description: Rule saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistRuleResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /wishlists/{wishlistId}/rules/{ruleId}:
    patch:
      tags: [Wishlists]
      summary: Update a rule (used to record sync results)
      operationId: updateWishlistRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/wishlistId"
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWishlistRuleInput"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistRuleResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Wishlists]
      summary: Remove a rule (cards it already added stay on the wishlist)
      operationId: removeWishlistRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/wishlistId"
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Rule removed

  # ─── Collection Guides ─────────────────────────────────────────────
  /guides:
    get:
      tags: [Guides]
      summary: List published collection guides with follow state
      operationId: listCollectionGuides
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Published guides
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CollectionGuide" }

  /guides/cards:
    get:
      tags: [Guides]
      summary: Search cards across all published collection guides
      operationId: searchCollectionGuideCards
      security:
        - bearerAuth: []
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - { name: tcg, in: query, schema: { $ref: "#/components/schemas/TcgCode" } }
        - { name: guide, in: query, schema: { type: string } }
        - name: category
          in: query
          schema:
            type: string
            enum: [art-style, artist, species, story, cameo, custom]
        - name: ownership
          in: query
          schema: { type: string, enum: [all, owned, missing], default: all }
        - { name: set, in: query, schema: { type: string } }
        - { name: artist, in: query, schema: { type: string } }
        - { name: rarity, in: query, schema: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
          description: Deduplicated cards with every matching guide membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideCardSearchResponse" }

  /guides/{slug}:
    get:
      tags: [Guides]
      summary: Get one published collection guide
      operationId: getCollectionGuide
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Collection guide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionGuide" }
        "404": { $ref: "#/components/responses/NotFound" }

  /guides/{slug}/items:
    get:
      tags: [Guides]
      summary: List exact ordered items for a published manual guide
      operationId: listCollectionGuideItems
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ordered exact-printing membership
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CollectionGuideItem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /guides/{slug}/follow:
    post:
      tags: [Guides]
      summary: Create or return the guide's synchronized wishlist
      operationId: followCollectionGuide
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                wishlistName: { type: string, minLength: 1 }
      responses:
        "200": { description: Guide was already followed }
