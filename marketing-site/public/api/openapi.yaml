        "201": { description: Shipment created }
        "501": { $ref: "#/components/responses/ConvexNotImplemented" }

  /shipments/{shipmentId}/status:
    get:
      tags: [Legacy availability]
      summary: Get shipment tracking status
      description: Available from the legacy router; returns 501 when BACKEND_MODE is convex.
      operationId: getShipmentStatus
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Shipment status }
        "501": { $ref: "#/components/responses/ConvexNotImplemented" }

  /shipments/{shipmentId}:
    delete:
      tags: [Legacy availability]
      summary: Delete a shipment
      description: Available from the legacy router; returns 501 when BACKEND_MODE is convex.
      operationId: deleteShipment
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - name: shipmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Shipment deleted }
        "501": { $ref: "#/components/responses/ConvexNotImplemented" }

# ═══════════════════════════════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque Better Auth session token returned by sign-in.
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie, normally managed automatically by the browser.

  parameters:
    tcg:
      name: tcg
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TcgCode"
    cardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
    binderId:
      name: binderId
      in: path
      required: true
      schema:
        type: string
    collectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
    wishlistId:
      name: wishlistId
      in: path
      required: true
      schema:
        type: string
    deckId:
      name: deckId
      in: path
      required: true
      schema:
        type: string
    tradeId:
      name: tradeId
      in: path
      required: true
      schema:
        type: string

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConvexNotImplemented:
      description: This legacy feature group is not available when BACKEND_MODE is convex.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ─── Enums & Primitives ──────────────────────────────────────────
    TcgCode:
      type: string
      enum: [yugioh, magic, pokemon, onepiece, lorcana, dragonball]
    ScannerTcgCode:
      type: string
      enum: [yugioh, magic, pokemon]

    ServerFeatures:
      type: object
      required:
        [
          decks,
          finance,
          sealed,
          analytics,
          trades,
          prices,
          notifications,
          alerts,
          shops,
          automations,
          shipments,
          public,
        ]
      properties:
        decks: { type: boolean }
        finance: { type: boolean }
        sealed: { type: boolean }
        analytics: { type: boolean }
        trades: { type: boolean }
        prices: { type: boolean }
        notifications: { type: boolean }
        alerts: { type: boolean }
        shops: { type: boolean }
        automations: { type: boolean }
        shipments: { type: boolean }
        public: { type: boolean }

    # ─── Error ───────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: Resource not found
        details:
          type: object

    # ─── Auth ────────────────────────────────────────────────────────
    BetterAuthSignUpInput:
      type: object
      required: [email, password, name, username]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          description: Display name; TCGer supplies the selected username.
        username:
          type: string
          minLength: 3
          maxLength: 50

    BetterAuthUsernameSignInInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 1

    AuthUser:
      type: object
      required:
        [
          id,
          email,
          isAdmin,
          showCardNumbers,
          showPricing,
          enabledYugioh,
          enabledMagic,
          enabledPokemon,
          enabledOnepiece,
          enabledLorcana,
          enabledDragonball,
        ]
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
          nullable: true
        isAdmin:
          type: boolean
        showCardNumbers:
          type: boolean
        showPricing:
          type: boolean
        enabledYugioh:
          type: boolean
        enabledMagic:
          type: boolean
        enabledPokemon:
          type: boolean
        enabledOnepiece:
          type: boolean
        enabledLorcana:
          type: boolean
        enabledDragonball:
          type: boolean

    BetterAuthSessionResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        token:
          type: string
          description: Opaque Better Auth session token.
        session:
          type: object
          additionalProperties: true
      nullable: true

    SetupCheckResponse:
      type: object
      required: [setupRequired]
      properties:
        setupRequired:
          type: boolean

    # ─── Decks, finance, sealed, and trades ─────────────────────────
    CreateDeckInput:
      type: object
      required: [name, tcg]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        tcg: { $ref: "#/components/schemas/TcgCode" }
        format: { type: string }
        colorHex: { type: string }
        isPublic: { type: boolean }

    UpdateDeckInput:
      type: object
      description: At least one property must be provided.
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        format: { type: string }
        colorHex: { type: string }
        isPublic: { type: boolean }

    ImportDeckInput:
      type: object
      required: [source, data]
      properties:
        source:
          type: string
          enum: [text, moxfield, archidekt, mtggoldfish, arena, ygoprodeck, ydk]
        data: { type: string, minLength: 1 }
        name: { type: string }
        tcg: { $ref: "#/components/schemas/TcgCode" }
        format: { type: string }

    AddDeckCardInput:
      type: object
      required: [externalId, tcg, name]
      properties:
        externalId: { type: string, minLength: 1 }
        tcg: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1, default: 1 }
        zone: { type: string, enum: [main, extra, side] }
        isCommander: { type: boolean }
        isSideboard: { type: boolean }
        imageUrl: { type: string }
        imageUrlSmall: { type: string }
        setCode: { type: string }
        setName: { type: string }
        cardData: { type: object, additionalProperties: true }

    CreateTransactionInput:
      type: object
      required: [type, amount]
      properties:
        type: { type: string, enum: [purchase, sale, trade] }
        cardId: { type: string }
        externalId: { type: string }
        tcg: { type: string }
        cardName: { type: string }
        quantity: { type: integer, minimum: 1, default: 1 }
        amount: { type: number }
        currency: { type: string, default: USD }
        platform: { type: string }
        notes: { type: string }
        date: { type: string, format: date-time }

    CreateSealedInventoryInput:
      type: object
      required: [productId]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, default: 1 }
        purchasePrice: { type: number, minimum: 0 }
        purchaseDate: { type: string, format: date-time }
        notes: { type: string }

    UpdateSealedInventoryInput:
      type: object
      description: At least one property must be provided.
      properties:
        quantity: { type: integer, minimum: 1 }
        purchasePrice: { type: number, minimum: 0 }
        purchaseDate: { type: string, format: date-time }
        notes: { type: string }

    CreateSealedOpeningInput:
      type: object
      properties:
        openedQuantity: { type: integer, minimum: 1, default: 1 }
        collectionIds:
          type: array
          maxItems: 500
          default: []
          items: { type: string, format: uuid }
        openedAt: { type: string, format: date-time }
        notes: { type: string, maxLength: 2000 }

    RecordOpenedCardSaleInput:
      type: object
      required: [proceeds]
      properties:
        proceeds: { type: number, minimum: 0 }
        soldAt: { type: string, format: date-time }

    TradeCardInput:
      type: object
      required: [externalId, tcg, name]
      properties:
        externalId: { type: string, minLength: 1 }
        tcg: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1, default: 1 }
        imageUrl: { type: string }
        estimatedValue: { type: number }

    CreateTradeInput:
      type: object
      required: [receiverId, senderCards]
      properties:
        receiverId: { type: string, format: uuid }
        message: { type: string }
        senderCards:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TradeCardInput" }
        receiverCards:
          type: array
          items: { $ref: "#/components/schemas/TradeCardInput" }

    # ─── Cards ───────────────────────────────────────────────────────
    Card:
      type: object
      required: [id, tcg, name]
      properties:
        id:
          type: string
        tcg:
          $ref: "#/components/schemas/TcgCode"
        name:
          type: string
        setCode:
          type: string
        setName:
          type: string
        rarity:
          type: string
        artist:
          type: string
          description: Provider illustrator or artist credit
        collectorNumber:
          type: string
        releasedAt:
          type: string
        imageUrl:
          type: string
        imageUrlSmall:
          type: string
        setSymbolUrl:
          type: string
          description: URL to the set expansion symbol image
        setLogoUrl:
          type: string
          description: URL to the set logo/branding image (Pokemon and MTG)
        regulationMark:
          type: string
        language:
          type: string
        pokemonPrint:
          $ref: "#/components/schemas/PokemonPrintMetadata"
        attributes:
          type: object
          additionalProperties: true

    PokemonPrintMetadata:
      type: object
      properties:
        tcgdexId:
          type: string
        tcgdexImage:
          type: string
        variants:
          $ref: "#/components/schemas/PokemonVariantFlags"
        finishes:
          type: array
          items:
            type: string
            enum: [normal, reverse, holo, firstEdition]
        category:
          type: string
        regulationMark:
          type: string
        language:
          type: string

    PokemonVariantFlags:
      type: object
      properties:
        normal:
          type: boolean
        reverse:
          type: boolean
        holo:
          type: boolean
        firstEdition:
          type: boolean

    PokemonFunctionalGroup:
      type: object
      required: [functionalKey, name]
      properties:
        functionalKey:
          type: string
        name:
          type: string
        supertype:
          type: string
        subtypes:
          type: array
          items:
            type: string
        hp:
          type: string
        regulationMark:
          type: string
        category:
          type: string
        normalizedRules:
          type: string
          nullable: true
        attacks:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              cost:
                type: array
                items:
                  type: string
              text:
                type: string
                nullable: true
              damage:
                type: string
                nullable: true
              convertedEnergyCost:
                type: integer
        abilities:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              text:
                type: string
                nullable: true
              type:
                type: string
        rules:
          type: array
          nullable: true
          items:
            type: string

    CardPrintsResponse:
      oneOf:
        - type: object
          required: [mode, prints, total]
          properties:
            mode:
              type: string
              enum: [simple]
            prints:
              type: array
              items:
                $ref: "#/components/schemas/Card"
            total:
              type: integer
        - type: object
          required: [mode, prints, total, functionalGroup]
          properties:
            mode:
              type: string
              enum: [pokemon-functional]
            prints:
              type: array
              items:
                $ref: "#/components/schemas/Card"
            total:
              type: integer
            functionalGroup:
              $ref: "#/components/schemas/PokemonFunctionalGroup"
      discriminator:
        propertyName: mode

    # ─── Collections ─────────────────────────────────────────────────
    CollectionTag:
      type: object
      required: [id, label, colorHex]
      properties:
        id:
          type: string
        label:
          type: string
        colorHex:
          type: string

    CollectionTagResponse:
      allOf:
        - $ref: "#/components/schemas/CollectionTag"
        - type: object
          required: [createdAt, updatedAt]
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    CollectionCardCopy:
      type: object
      required: [id, tags]
      properties:
        id:
          type: string
        condition:
          type: string
        language:
          type: string
        notes:
          type: string
        price:
          type: number
        acquisitionPrice:
          type: number
        serialNumber:
          type: string
        acquiredAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            $ref: "#/components/schemas/CollectionTag"

    CollectionCard:
      type: object
      required: [id, cardId, name, tcg, quantity, copies]
      properties:
        id:
          type: string
        cardId:
          type: string
        externalId:
          type: string
        name:
          type: string
        tcg:
          type: string
        setCode:
          type: string
        setName:
          type: string
        rarity:
          type: string
        imageUrl:
          type: string
        imageUrlSmall:
          type: string
        quantity:
          type: integer
        condition:
          type: string
        language:
          type: string
        notes:
          type: string
        price:
          type: number
        binderId:
          type: string
        binderName:
          type: string
        binderColorHex:
          type: string
        conditionSummary:
          type: string
        copies:
          type: array
          items:
            $ref: "#/components/schemas/CollectionCardCopy"

    Binder:
      type: object
      required: [id, name, cards, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        colorHex:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/CollectionCard"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateBinderInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        colorHex:
          type: string
          pattern: "^([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$"

    UpdateBinderInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        colorHex:
          type: string
          pattern: "^([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$"

    CardDataPayload:
      type: object
      required: [name, tcg, externalId]
      properties:
        name:
          type: string
        tcg:
          type: string
        externalId:
          type: string
        setCode:
          type: string
        setName:
          type: string
        rarity:
          type: string
        imageUrl:
          type: string
        imageUrlSmall:
          type: string

    TagPayload:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
        colorHex:
          type: string
          pattern: "^([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$"

    AddCardInput:
      type: object
      required: [cardId]
      properties:
        cardId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          default: 1
        condition:
          type: string
        language:
          type: string
        notes:
          type: string
        price:
          type: number
        acquisitionPrice:
          type: number
        serialNumber:
          type: string
        acquiredAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        newTags:
          type: array
          items:
            $ref: "#/components/schemas/TagPayload"
        cardData:
          $ref: "#/components/schemas/CardDataPayload"

    UpdateCardInput:
      type: object
      description: At least one field must be provided
      properties:
        condition:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        serialNumber:
          type: string
          nullable: true
        acquiredAt:
          type: string
          format: date-time
          nullable: true
        quantity:
          type: integer
          minimum: 1
        tags:
          type: array
          items:
            type: string
        newTags:
          type: array
          items:
            $ref: "#/components/schemas/TagPayload"
        targetBinderId:
          type: string
          minLength: 1
        cardOverride:
          type: object
          required: [cardId]
          properties:
            cardId:
              type: string
              minLength: 1
            cardData:
              $ref: "#/components/schemas/CardDataPayload"

    CreateTagInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
        colorHex:
          type: string
          pattern: "^([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$"

    # ─── Wishlists ─────────────────────────────────────────────────
    WishlistCardResponse:
      type: object
      required: [id, externalId, tcg, name, owned, ownedQuantity, createdAt]
      properties:
        id:
          type: string
        externalId:
          type: string
        tcg:
          $ref: "#/components/schemas/TcgCode"
        name:
          type: string
        setCode:
          type: string
        setName:
          type: string
        rarity:
          type: string
        artist:
          type: string
        imageUrl:
          type: string
        imageUrlSmall:
          type: string
        setSymbolUrl:
          type: string
          description: URL to the set expansion symbol image
        setLogoUrl:
          type: string
          description: URL to the set logo/branding image
        collectorNumber:
          type: string
        notes:
          type: string
        owned:
          type: boolean
          description: Whether this card exists in the user's collection
        ownedQuantity:
          type: integer
          description: Total quantity owned across all binders
        createdAt:
          type: string
          format: date-time

    WishlistResponse:
      type: object
      required:
        [
          id,
          name,
          cards,
          rules,
          totalCards,
          ownedCards,
          completionPercent,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        colorHex:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/WishlistCardResponse"
        rules:
          type: array
          description: Saved expansion rules; empty for a purely manual wishlist
          items:
            $ref: "#/components/schemas/WishlistRuleResponse"
        totalCards:
          type: integer
          description: Number of unique cards in the wishlist
        ownedCards:
          type: integer
          description: Number of cards that exist in the user's collection
        completionPercent:
          type: integer
          description: Completion percentage (0-100)
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WishlistRuleResponse:
      type: object
      required: [id, type, includeAllPrintings, autoSync, createdAt, updatedAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [name, set, artist]
        tcg:
          $ref: "#/components/schemas/TcgCode"
        query:
          type: string
          description: Name or exact provider illustrator matched by the rule
        setCode:
          type: string
        setName:
          type: string
        includeAllPrintings:
          type: boolean
          description: Match every printing rather than one entry per distinct card
        autoSync:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
        lastMatchCount:
          type: integer
          description: How many cards the rule matched on its last sync
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWishlistRuleInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [name, set, artist]
        tcg:
          $ref: "#/components/schemas/TcgCode"
        query:
          type: string
          description: Required for a name or artist rule
          minLength: 1
        setCode:
          type: string
          description: Required for a set rule (along with tcg)
          minLength: 1
        setName:
          type: string
        includeAllPrintings:
          type: boolean
          default: true
        autoSync:
          type: boolean
          default: true

    UpdateWishlistRuleInput:
      type: object
      properties:
        autoSync:
          type: boolean
        includeAllPrintings:
          type: boolean
        lastSyncedAt:
          type: string
          format: date-time
        lastMatchCount:
          type: integer
          minimum: 0

    CreateWishlistInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        colorHex:
          type: string
          pattern: "^([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$"

    UpdateWishlistInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        colorHex:
          type: string
          pattern: "^([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$"

    AddWishlistCardInput:
      type: object
      required: [externalId, tcg, name]
      properties:
        externalId:
          type: string
          minLength: 1
        tcg:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        setCode:
          type: string
        setName:
          type: string
        rarity:
          type: string
        artist:
          type: string
        imageUrl:
          type: string
        imageUrlSmall:
          type: string
        setSymbolUrl:
          type: string
        setLogoUrl:
          type: string
        collectorNumber:
          type: string
        notes:
          type: string

    CollectionGuide:
      type: object
      required:
        [
          id,
          slug,
          title,
          description,
          tcg,
          category,
          curatorName,
          tags,
          version,
          featured,
          rule,
          followed,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        tcg: { $ref: "#/components/schemas/TcgCode" }
        category:
          type: string
          enum: [art-style, artist, species, story, cameo, custom]
        coverImageUrl: { type: string }
        curatorName: { type: string }
        tags: { type: array, items: { type: string } }
        version: { type: integer }
        featured: { type: boolean }
        cardCountHint: { type: integer }
        followed: { type: boolean }
        wishlistId: { type: string }
        rule:
          type: object
          required: [type, tcg, includeAllPrintings]
          properties:
            type: { type: string, enum: [name, set, artist, manual] }
            tcg: { $ref: "#/components/schemas/TcgCode" }
            query: { type: string }
            setCode: { type: string }
            setName: { type: string }
            includeAllPrintings: { type: boolean }

    CollectionGuideItem:
      type: object
      required: [id, guideId, tcg, externalId, name, position]
      properties:
        id: { type: string }
        guideId: { type: string }
        tcg: { $ref: "#/components/schemas/TcgCode" }
        externalId: { type: string }
        name: { type: string }
        setCode: { type: string }
        setName: { type: string }
        collectorNumber: { type: string }
        rarity: { type: string }
        artist: { type: string }
        variant: { type: string }
        imageUrl: { type: string }
        imageUrlSmall: { type: string }
        groupKey: { type: string }
        groupLabel: { type: string }
        groupOrder: { type: integer }
        position: { type: integer }
        note: { type: string }
        provenanceUrl: { type: string }

    GuideCardMembership:
      type: object
      required: [guideId, slug, title, category, tags]
      properties:
        guideId: { type: string }
        slug: { type: string }
        title: { type: string }
        category:
          type: string
          enum: [art-style, artist, species, story, cameo, custom]
        tags: { type: array, items: { type: string } }
        groupKey: { type: string }
        groupLabel: { type: string }
        groupOrder: { type: integer }
        position: { type: integer }

    GuideCardSearchResult:
      type: object
      required: [card, owned, ownedQuantity, matchedGuides]
      properties:
        card: { $ref: "#/components/schemas/Card" }
        owned: { type: boolean }
        ownedQuantity: { type: integer }
        matchedGuides:
          type: array
          items: { $ref: "#/components/schemas/GuideCardMembership" }

    GuideCardSearchResponse:
      type: object
      required: [results, total, failedGuideSlugs]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/GuideCardSearchResult" }
        total: { type: integer }
        failedGuideSlugs:
          type: array
          items: { type: string }

    # ─── Users ───────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, email, isAdmin, showCardNumbers, showPricing, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
          nullable: true
        isAdmin:
          type: boolean
        showCardNumbers:
          type: boolean
        showPricing:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserPreferences:
      type: object
      required:
        [
          showCardNumbers,
          showPricing,
          enabledYugioh,
          enabledMagic,
          enabledPokemon,
          enabledOnepiece,
          enabledLorcana,
          enabledDragonball,
        ]
      properties:
        showCardNumbers:
          type: boolean
        showPricing:
          type: boolean
        enabledYugioh:
          type: boolean
        enabledMagic:
          type: boolean
        enabledPokemon:
          type: boolean
        enabledOnepiece:
          type: boolean
        enabledLorcana:
          type: boolean
        enabledDragonball:
          type: boolean
        defaultGame:
          allOf:
            - $ref: "#/components/schemas/TcgCode"
          nullable: true

    UpdatePreferencesInput:
      type: object
      description: At least one field must be provided
      properties:
        showCardNumbers:
          type: boolean
        showPricing:
          type: boolean
        enabledYugioh:
          type: boolean
        enabledMagic:
          type: boolean
        enabledPokemon:
          type: boolean
        enabledOnepiece:
          type: boolean
        enabledLorcana:
          type: boolean
        enabledDragonball:
          type: boolean
        defaultGame:
          allOf:
            - $ref: "#/components/schemas/TcgCode"
          nullable: true

    UpdateProfileInput:
      type: object
      description: At least one field must be provided
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8

    # ─── Settings ────────────────────────────────────────────────────
    AppSettings:
      type: object
      required:
        [
          id,
          publicDashboard,
          publicCollections,
          requireAuth,
          appName,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        publicDashboard:
          type: boolean
        publicCollections:
          type: boolean
        requireAuth:
          type: boolean
        appName:
          type: string
        updatedAt:
          type: string
          format: date-time

    UpdateSettingsInput:
      type: object
      properties:
        publicDashboard:
          type: boolean
        publicCollections:
          type: boolean
        requireAuth:
          type: boolean
        appName:
          type: string
