services:
  postgres:
    image: postgres:15-alpine
    container_name: tcg-postgres
    restart: unless-stopped
    profiles:
      - legacy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcg_collection}
      POSTGRES_USER: ${POSTGRES_USER:-tcguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcgpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcguser} -d ${POSTGRES_DB:-tcg_collection}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - tcg-net

  convex-backend:
    build:
      context: ..
      dockerfile: docker/convex-backend.Dockerfile
      target: dev
    container_name: tcg-convex-backend
    command:
      - sh
      - -ec
      - |
        cd /app
        npm run --workspace=packages/api-types build
        cd /app/convex-backend
        exec npm run dev:local
    environment:
      NODE_ENV: development
      TCGER_CONVEX_DEV_TARGET: ${TCGER_CONVEX_DEV_TARGET:-anonymous}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-tcger-local-convex-auth-secret-2026}
      TCGER_BRIDGE_SECRET: ${TCGER_BRIDGE_SECRET:-tcger-local-convex-bridge-secret-2026}
      BETTER_AUTH_DISABLE_ORIGIN_CHECK: ${BETTER_AUTH_DISABLE_ORIGIN_CHECK:-false}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000/api/auth}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      BETTER_AUTH_USE_SECURE_COOKIES: ${BETTER_AUTH_USE_SECURE_COOKIES:-}
      SCRYFALL_API_BASE_URL: ${SCRYFALL_API_BASE_URL:-https://api.scryfall.com}
      YGO_API_BASE_URL: ${YGO_API_BASE_URL:-https://db.ygoprodeck.com/api/v7}
      POKEMON_API_BASE_URL: ${POKEMON_API_BASE_URL:-https://api.tcgdex.net/v2/en}
      TCGDEX_API_BASE_URL: ${TCGDEX_API_BASE_URL:-https://api.tcgdex.net/v2/en}
      JUSTTCG_API_BASE_URL: ${JUSTTCG_API_BASE_URL:-https://api.justtcg.com/v1}
      JUSTTCG_API_KEY: ${JUSTTCG_API_KEY:-}
    volumes:
      - ../convex-backend:/app/convex-backend
      - convex_data:/app/convex-backend/.convex
      - ../packages/api-types:/app/packages/api-types
      - ../tools/dev:/app/tools/dev:ro
      - /app/node_modules
      - ../tsconfig.base.json:/app/tsconfig.base.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "../tools/dev/convex-dev.mjs",
          "--health",
        ]
      start_period: 180s
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${CONVEX_PORT:-3210}:3210"
      - "${CONVEX_SITE_PORT:-3211}:3211"
    networks:
      - tcg-net

  scryfall-bulk:
    build:
      context: ..
      dockerfile: services/scryfall-bulk/Dockerfile
    container_name: tcg-scryfall-bulk
    restart: unless-stopped
    environment:
      SCRYFALL_BULK_TYPE: ${SCRYFALL_BULK_TYPE:-oracle_cards}
      SCRYFALL_BULK_REFRESH_MS: ${SCRYFALL_BULK_REFRESH_MS:-43200000}
      SCRYFALL_BULK_MAX_RESULTS: ${SCRYFALL_BULK_MAX_RESULTS:-50}
      SCRYFALL_BULK_CACHE_IMAGES: ${SCRYFALL_BULK_CACHE_IMAGES:-true}
      SCRYFALL_BULK_IMAGE_DIR: ${SCRYFALL_BULK_IMAGE_DIR:-/data/images}
      SCRYFALL_BULK_IMAGE_FIELD: ${SCRYFALL_BULK_IMAGE_FIELD:-normal}
      SCRYFALL_BULK_IMAGE_FALLBACKS: ${SCRYFALL_BULK_IMAGE_FALLBACKS:-large,small,border_crop,art_crop}
      SCRYFALL_BULK_IMAGE_MAX_PER_REFRESH: ${SCRYFALL_BULK_IMAGE_MAX_PER_REFRESH:-250}
      SCRYFALL_BULK_IMAGE_CONCURRENCY: ${SCRYFALL_BULK_IMAGE_CONCURRENCY:-4}
      PORT: 4010
    volumes:
      - scryfall_bulk_data:/data
    ports:
      - "${SCRYFALL_BULK_PORT:-4010}:4010"
    profiles:
      - bulk
    networks:
      - tcg-net

  ygo-cache:
    build:
      context: ..
      dockerfile: services/ygo-cache/Dockerfile
    container_name: tcg-ygo-cache
    restart: unless-stopped
    environment:
      YGO_SOURCE_BASE_URL: ${YGO_SOURCE_BASE_URL:-https://db.ygoprodeck.com/api/v7}
      YGO_CACHE_REFRESH_MS: ${YGO_CACHE_REFRESH_MS:-43200000}
      YGO_CACHE_PAGE_SIZE: ${YGO_CACHE_PAGE_SIZE:-20}
      YGO_CACHE_MAX_PAGE_SIZE: ${YGO_CACHE_MAX_PAGE_SIZE:-200}
      PORT: 4020
    volumes:
      - ygo_cache_data:/data
    ports:
      - "${YGO_CACHE_PORT:-4020}:4020"
    profiles:
      - bulk
    networks:
      - tcg-net

  pokemon-cache:
    build:
      context: ..
      dockerfile: services/pokemon-cache/Dockerfile
    container_name: tcg-pokemon-cache
    restart: unless-stopped
    environment:
      POKEMON_SOURCE_BASE_URL: ${POKEMON_SOURCE_BASE_URL:-https://api.pokemontcg.io/v2}
      POKEMON_SOURCE_API_KEY: ${POKEMON_SOURCE_API_KEY:-}
      SCRYDEX_API_KEY: ${SCRYDEX_API_KEY:-}
      SCRYDEX_TEAM_ID: ${SCRYDEX_TEAM_ID:-}
      POKEMON_CACHE_REFRESH_MS: ${POKEMON_CACHE_REFRESH_MS:-43200000}
      POKEMON_CACHE_PAGE_SIZE: ${POKEMON_CACHE_PAGE_SIZE:-20}
      POKEMON_CACHE_MAX_PAGE_SIZE: ${POKEMON_CACHE_MAX_PAGE_SIZE:-200}
      POKEMON_CACHE_FETCH_PAGE_SIZE: ${POKEMON_CACHE_FETCH_PAGE_SIZE:-250}
      POKEMON_CACHE_FETCH_DELAY_MS: ${POKEMON_CACHE_FETCH_DELAY_MS:-200}
      PORT: 4030
    volumes:
      - pokemon_cache_data:/data
    ports:
      - "${POKEMON_CACHE_PORT:-4030}:4030"
    profiles:
      - bulk
    networks:
      - tcg-net

  tcgdex-cache:
    build:
      context: ..
      dockerfile: services/tcgdex-cache/Dockerfile
    container_name: tcg-tcgdex-cache
    restart: unless-stopped
    environment:
      TCGDEX_CACHE_REFRESH_MS: ${TCGDEX_CACHE_REFRESH_MS:-86400000}
      TCGDEX_CACHE_PAGE_SIZE: ${TCGDEX_CACHE_PAGE_SIZE:-20}
      PORT: 4040
    volumes:
      - tcgdex_cache_data:/data
    ports:
      - "${TCGDEX_CACHE_PORT:-4040}:4040"
    profiles:
      - bulk
    networks:
      - tcg-net

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      target: dev
    container_name: tcg-backend
    command:
      - sh
      - -ec
      - |
        cd /app
        ONNXRUNTIME_NODE_INSTALL=skip npm ci --workspace=@tcg/backend --workspace=@tcg/api-types --include-workspace-root=false --no-audit --no-fund
        npm run --workspace=packages/api-types build
        cd /app/backend
        npx prisma generate
        if [ "$${BACKEND_MODE:-convex}" != "convex" ]; then npx prisma migrate deploy; fi
        exec npm run dev
    environment:
      NODE_ENV: development
      PORT: 3000
      BACKEND_MODE: ${BACKEND_MODE:-convex}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tcguser}:${POSTGRES_PASSWORD:-tcgpassword}@postgres:5432/${POSTGRES_DB:-tcg_collection}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COLLECTIONS_BACKEND: ${COLLECTIONS_BACKEND:-convex}
      WISHLISTS_BACKEND: ${WISHLISTS_BACKEND:-convex}
      CONVEX_HTTP_ORIGIN: ${CONVEX_HTTP_ORIGIN:-http://convex-backend:3211}
      TCGER_BRIDGE_SECRET: ${TCGER_BRIDGE_SECRET:-tcger-local-convex-bridge-secret-2026}
      SCRYDEX_API_KEY: ${SCRYDEX_API_KEY:-}
      SCRYDEX_TEAM_ID: ${SCRYDEX_TEAM_ID:-}
      SCRYFALL_API_BASE_URL: ${SCRYFALL_API_BASE_URL:-https://api.scryfall.com}
      YGO_API_BASE_URL: ${YGO_API_BASE_URL:-https://db.ygoprodeck.com/api/v7}
      POKEMON_API_BASE_URL: ${POKEMON_API_BASE_URL:-https://api.tcgdex.net/v2/en}
      TCGDEX_API_BASE_URL: ${TCGDEX_API_BASE_URL:-https://api.tcgdex.net/v2/en}
      JUSTTCG_API_BASE_URL: ${JUSTTCG_API_BASE_URL:-https://api.justtcg.com/v1}
      JUSTTCG_API_KEY: ${JUSTTCG_API_KEY:-}
      POKEWALLET_API_BASE_URL: ${POKEWALLET_API_BASE_URL:-https://api.pokewallet.io}
      POKEWALLET_API_KEY: ${POKEWALLET_API_KEY:-}
      POKEWALLET_PROXY_SECRET: ${POKEWALLET_PROXY_SECRET:-}
      PRICE_USD_TO_EUR: ${PRICE_USD_TO_EUR:-}
      PRICE_FX_SOURCE: ${PRICE_FX_SOURCE:-}
      PRICE_FX_AS_OF: ${PRICE_FX_AS_OF:-}
      TCGCSV_API_BASE_URL: ${TCGCSV_API_BASE_URL:-https://tcgcsv.com/tcgplayer}
      TCGCSV_MIN_INTERVAL_MS: ${TCGCSV_MIN_INTERVAL_MS:-100}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-2}
      SCRYFALL_MIN_INTERVAL_MS: ${SCRYFALL_MIN_INTERVAL_MS:-120}
      PSA_API_BASE_URL: ${PSA_API_BASE_URL:-https://api.psacard.com/publicapi}
      PSA_API_TOKEN: ${PSA_API_TOKEN:-}
      PSA_MIN_INTERVAL_MS: ${PSA_MIN_INTERVAL_MS:-350}
      POKEMON_PRICE_TRACKER_API_BASE_URL: ${POKEMON_PRICE_TRACKER_API_BASE_URL:-https://www.pokemonpricetracker.com/api/v2}
      POKEMON_PRICE_TRACKER_API_KEY: ${POKEMON_PRICE_TRACKER_API_KEY:-}
      POKEMON_PRICE_TRACKER_LICENSE_ACK: ${POKEMON_PRICE_TRACKER_LICENSE_ACK:-false}
      POKEMON_PRICE_TRACKER_MIN_INTERVAL_MS: ${POKEMON_PRICE_TRACKER_MIN_INTERVAL_MS:-250}
      CARD_SCAN_RATE_WINDOW_MS: ${CARD_SCAN_RATE_WINDOW_MS:-60000}
      CARD_SCAN_RATE_LIMIT: ${CARD_SCAN_RATE_LIMIT:-20}
      CARD_SCAN_MAX_CONCURRENT: ${CARD_SCAN_MAX_CONCURRENT:-4}
      CARD_SCAN_MAX_CONCURRENT_PER_USER: ${CARD_SCAN_MAX_CONCURRENT_PER_USER:-1}
      CARD_SCAN_MAX_PIXELS: ${CARD_SCAN_MAX_PIXELS:-25000000}
      UPLOADS_DIR: /app/uploads
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
      EBAY_MARKETPLACE_ID: ${EBAY_MARKETPLACE_ID:-EBAY_US}
      EBAY_USE_SANDBOX: ${EBAY_USE_SANDBOX:-false}
      PRICE_REFRESH_INTERVAL_MS: ${PRICE_REFRESH_INTERVAL_MS:-43200000}
      PRICE_FORCE_REFRESH_COOLDOWN_MS: ${PRICE_FORCE_REFRESH_COOLDOWN_MS:-300000}
      ONEPIECE_API_BASE_URL: ${ONEPIECE_API_BASE_URL:-https://optcgapi.com/api}
      LORCANA_API_BASE_URL: ${LORCANA_API_BASE_URL:-https://api.lorcast.com/v0}
      APITCG_API_BASE_URL: ${APITCG_API_BASE_URL:-https://api.apitcg.com}
      APITCG_API_KEY: ${APITCG_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
      - ../backend:/app/backend
      - ../packages:/app/packages
      - ../data/catalog:/app/data/catalog:ro
      - /app/node_modules
      - ../tsconfig.base.json:/app/tsconfig.base.json:ro
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    depends_on:
      convex-backend:
        condition: service_healthy
    networks:
      - tcg-net

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: dev
    container_name: tcg-frontend
    command: sh -c "cd /app && npm run --workspace=packages/api-types build && cd /app/frontend && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
      NEXT_DIST_DIR: ${NEXT_DIST_DIR:-.next-docker}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api}
      BACKEND_API_ORIGIN: ${BACKEND_API_ORIGIN:-http://backend:3000}
      NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-http://localhost:3210}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${NEXT_PUBLIC_CONVEX_SITE_URL:-http://localhost:3211}
      CONVEX_URL_INTERNAL: ${CONVEX_URL_INTERNAL:-http://convex-backend:3210}
      CONVEX_SITE_URL_INTERNAL: ${CONVEX_SITE_URL_INTERNAL:-http://convex-backend:3211}
    volumes:
      - ../frontend:/app/frontend
      - ../packages:/app/packages
      - /app/node_modules
      - ../tsconfig.base.json:/app/tsconfig.base.json:ro
    depends_on:
      backend:
        condition: service_started
    profiles:
      - frontend
    networks:
      - tcg-net

  gateway:
    image: nginx:1.30-alpine
    container_name: tcg-gateway
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${APP_PORT:-3000}:80"
    profiles:
      - frontend
    networks:
      - tcg-net

volumes:
  uploads_data:
  postgres_data:
  convex_data:
  scryfall_bulk_data:
  ygo_cache_data:
  pokemon_cache_data:
  tcgdex_cache_data:

networks:
  tcg-net:
    driver: bridge
