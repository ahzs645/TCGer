  /finance/transactions:
    get:
      tags: [Finance]
      summary: List finance transactions
      description: Returns up to 100 records, or up to 10 records for the specified collectionEntryId. Supported in full Convex and legacy hybrid mode.
      operationId: listFinanceTransactions
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - name: collectionEntryId
          in: query
          description: Filter by the stored physical-copy identity linked to the transaction.
          schema: { type: string }
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TransactionResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Finance]
      summary: Record a finance transaction
      description: >-
        Standalone ledger records are supported in both modes. In full Convex,
        a purchase with collectionEntryId updates the owned copy's acquisition
        amount, currency and date in the same transaction. Its quantity must
        match the addressed physical copy. A matching existing purchase is
        returned instead of duplicated; a different purchase for that copy is
        rejected with 409 and should be edited with PATCH. Linked operations
        require health.features.linkedAcquisitions to be explicitly true.
        Hybrid rejects every collectionEntryId link with 501 before writing.
        This route alone never removes sold inventory; use /finance/sales for
        an atomic selected-copy sale and removal.
      operationId: createFinanceTransaction
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTransactionInput" }
      responses:
        "201":
          description: Transaction created, or matching linked purchase returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: The physical copy already has a different linked purchase }
        "501": { $ref: '#/components/responses/LinkedAcquisitionUnavailable' }

  /finance/transactions/{transactionId}:
    parameters:
      - name: transactionId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Finance]
      summary: Update a finance transaction and its linked acquisition
      description: >-
        Omitted fields preserve their values. Explicit null clears the nullable
        metadata fields. The transaction type cannot be changed. For a linked
        purchase in full Convex, amount, currency and date update the copy's
        acquisition fields atomically. Moving or clearing the purchase link
        clears its previous acquisition mapping and verifies ownership of the
        new copy. Editing a historical purchase for a removed copy does not
        recreate inventory. Hybrid returns 501 if the existing or requested
        transaction has a collectionEntryId link, before any write.
      operationId: updateFinanceTransaction
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTransactionInput' }
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: The requested copy already has another linked purchase }
        "501": { $ref: '#/components/responses/LinkedAcquisitionUnavailable' }
    delete:
      tags: [Finance]
      summary: Delete a finance transaction
      description: >-
        In full Convex, deleting a linked purchase also clears the acquisition
        fields it owns on the physical copy in the same transaction. A removed
        copy is not recreated. Hybrid rejects deletion of linked records with
        501. Deleting a sale ledger record does not reverse its inventory change.
      operationId: deleteFinanceTransaction
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        "204": { description: Transaction deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "501": { $ref: '#/components/responses/LinkedAcquisitionUnavailable' }

  /finance/acquisition-cost-split:
    post:
      tags: [Finance]
      summary: Allocate a purchase cost across owned copies atomically
      description: >-
        Available only in full Convex; clients require explicit
        health.features.linkedAcquisitions. The operation records purchase
        transactions and original acquisition costs together, preserving the
        total in integer cents. Each copy must be owned and appear once, with
        no existing linked purchase; each allocation must receive at least
        one cent. Persist a stable operationId and frozen payload before
        sending. When supplied, an identical retry returns the original receipt
        and a changed payload returns 409. Omitting operationId retains legacy
        non-replayable behavior. The receipt's auditId identifies the acquisition
        allocation for collection-history undo, which reconciles its purchases
        and copy snapshots together. Legacy hybrid does not mount this route.
      operationId: splitAcquisitionCost
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcquisitionCostSplitInput' }
      responses:
        "201":
          description: Committed or replayed allocation receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcquisitionCostSplitResult' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { description: Owned copy not found, or route unavailable in legacy hybrid mode }
        "409": { description: Existing purchase, changed operation payload, or legacy state requiring review }

  /finance/summary:
    get:
      tags: [Finance]
      summary: Get the legacy USD spending and earnings summary
      description: >-
        Money fields contain USD purchase/sale amounts only; trade records do
        not add spending or earnings. No foreign-currency conversion is implied.
        Use /finance/summary/by-currency for original-currency totals.
        transactionCount counts records across all currencies, including trades.
        Full Convex rejects more than 5000 USD transactions with
        LIMIT_EXCEEDED instead of returning partial money totals; legacy hybrid
        reads all transaction records.
      operationId: getFinanceSummary
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        "200":
          description: USD-only money totals and total record count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceSummary' }
        "400": { description: LIMIT_EXCEEDED when the full Convex USD transaction scan exceeds 5000 records }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /finance/summary/by-currency:
    get:
      tags: [Finance]
      summary: Get original-currency spending and earnings totals
      description: >-
        Supported in both modes. Purchase and sale amounts are grouped by
        original currency without conversion; trade records only contribute to
        the record count. Full Convex rejects more than 5000 transaction records
        with LIMIT_EXCEEDED instead of silently returning partial totals;
        legacy hybrid uses all records. This response has no truncation flag.
      operationId: getFinanceSummaryByCurrency
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        "200":
          description: Separate totals for each currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceSummaryByCurrency' }
        "400": { description: LIMIT_EXCEEDED when the full Convex transaction scan exceeds 5000 records }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /finance/realized-performance:
    get:
      tags: [Finance]
      summary: Get realized sale results and separate inventory references
      description: >-
        Full Convex only. Sale results remain grouped by original currency.
        Inventory cost and market value are independent references: inventoryCost
        includes explicit USD acquisition costs, while inventoryMarketValue
        includes all recorded USD market values. These are different populations
        and must not be subtracted to infer a portfolio profit. Original costs
        are also grouped in inventoryCostsByCurrency, including UNKNOWN when a
        legacy acquisition has no currency. periodDays filters sales, not current
        inventory. Legacy hybrid does not mount this route.
      operationId: getRealizedPerformance
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - name: periodDays
          in: query
          description: Include sales from the last specified number of days; omit for all sales within the response's bounded scan.
          schema: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "200":
          description: Sale metrics and current inventory references, with explicit scan truncation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealizedPerformance' }
        "400": { $ref: '#/components/responses/ValidationError' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { description: Route unavailable in legacy hybrid mode }

