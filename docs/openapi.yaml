          type: string
          minLength: 1
        colorHex:
          type: string
          pattern: "^([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$"

    AddCardInput:
      type: object
      required: [cardId]
      description: Reviewed printing and physical-copy metadata. cardData supplies the exact game-qualified snapshot when cardId is not an existing server card. No acquisition currency is inferred for an unlabeled acquisitionPrice.
      properties:
        cardId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 500
          default: 1
        condition:
          type: string
          minLength: 1
          description: Recognized grading condition or alias, matched case-insensitively after trimming (for example Near Mint/NM, Lightly Played/LP, Moderately Played/MP, Heavily Played/HP or Damaged/DMG).
        language:
          type: string
        notes:
          type: string
        price:
          type: number
          description: Stored market-value reference in USD; independent of original acquisition cost.
        acquisitionPrice:
          type: number
          minimum: 0
        acquisitionCurrency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          description: Original acquisition currency, normalized to uppercase when present. Missing means unknown, never an implicit USD value.
        serialNumber:
          type: string
        acquiredAt:
          type: string
          format: date-time
        isFoil: { type: boolean }
        finishCode: { type: string, minLength: 1 }
        finishLabel: { type: string, minLength: 1 }
        edition: { type: string, minLength: 1 }
        stamp: { type: string, minLength: 1 }
        isSealedPromo: { type: boolean }
        isOversized: { type: boolean }
        isPeelOff: { type: boolean }
        isSigned: { type: boolean }
        isAltered: { type: boolean }
        gradingCompany: { type: string, minLength: 1 }
        gradingScore: { type: string, minLength: 1 }
        certNumber: { type: string, minLength: 1 }
        storageLocation: { type: string, minLength: 1 }
        tags:
          type: array
          items:
            type: string
        newTags:
          type: array
          items:
            $ref: "#/components/schemas/TagPayload"
        cardData:
          $ref: "#/components/schemas/CardDataPayload"

    UpdateCardInput:
      type: object
      minProperties: 1
      description: At least one recognized field must be provided. Omitted fields preserve values. Nullable fields may be cleared with null. Acquisition fields of a copy with a linked purchase must be edited through the finance transaction API so inventory and ledger stay consistent.
      properties:
        acquisitionPrice:
          type: number
          minimum: 0
          nullable: true
        acquisitionCurrency:
          type: string
          nullable: true
          pattern: '^[A-Za-z]{3}$'
          description: Original acquisition currency, normalized to uppercase; null clears it to unknown.
        condition:
          type: string
          nullable: true
          description: Recognized grading condition or alias, matched case-insensitively. Null or the empty string clears the condition.
        language:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        serialNumber:
          type: string
          nullable: true
        acquiredAt:
          type: string
          format: date-time
          nullable: true
        isFoil: { type: boolean }
        finishCode: { type: string, minLength: 1, nullable: true }
        finishLabel: { type: string, minLength: 1, nullable: true }
        edition: { type: string, minLength: 1, nullable: true }
        stamp: { type: string, minLength: 1, nullable: true }
        isSealedPromo: { type: boolean }
        isOversized: { type: boolean }
        isPeelOff: { type: boolean }
        isSigned: { type: boolean }
        isAltered: { type: boolean }
        gradingCompany: { type: string, minLength: 1, nullable: true }
        gradingScore: { type: string, minLength: 1, nullable: true }
        certNumber: { type: string, minLength: 1, nullable: true }
        storageLocation: { type: string, minLength: 1, nullable: true }
        quantity:
          type: integer
          minimum: 1
          maximum: 500
        tags:
          type: array
          items:
            type: string
        newTags:
          type: array
          items:
            $ref: "#/components/schemas/TagPayload"
        targetBinderId:
          type: string
          minLength: 1
        scope:
          type: string
          enum: [card, copy]
          default: copy
          description: A targetBinderId move affects only this copy by default. Use card explicitly to move the printing group; a printing correction still targets only the addressed copy.
        cardOverride:
          type: object
          required: [cardId]
          properties:
            cardId:
              type: string
              minLength: 1
            cardData:
              $ref: "#/components/schemas/CardDataPayload"

    CreateTagInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
        colorHex:
          type: string
          pattern: "^([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$"

