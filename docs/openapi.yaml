        artworkId: { type: string, minLength: 1 }
        printingKind: { type: string, minLength: 1 }
        sanctionedPlayLegal: { type: boolean }
        originalPrintingKey: { type: string, minLength: 1 }
        setCode:
          type: string
        setName:
          type: string
        rarity:
          type: string
        collectorNumber: { type: string }
