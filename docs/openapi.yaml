              validTo: { type: string }
              legal: { type: boolean }
        evolution:
          type: object
          properties:
            evolvesFrom: { type: string }
            evolvesTo:
              type: array
              items: { type: string }
        functionalIdentity:
          type: object
          required: [key]
          properties:
            key: { type: string, minLength: 1 }
            normalizedRules: { type: string, nullable: true }

    TagPayload:
      type: object
