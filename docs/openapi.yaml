        language: { type: string }
        supertype: { type: string }
        formatLegality:
          type: object
          properties:
            standard: { type: boolean }
            expanded: { type: boolean }
        dexEntries:
          type: array
          items: { $ref: '#/components/schemas/PokedexEntry' }
        region: { type: string }
        pokemonPrint:
          $ref: '#/components/schemas/PokemonPrintMetadata'
