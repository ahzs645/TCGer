name: Deploy Site to Pages

on:
  push:
    branches:
      - main
    paths:
      - "marketing-site/**"
      - "docs/**"
      - "frontend/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".gitmodules"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            marketing-site/package-lock.json
            docs/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix marketing-site
          npm ci --prefix docs

      - name: Build shared API types
        run: npm --prefix packages/api-types run build

      - name: Build marketing site
        run: |
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"
          fi
          if [ "${BASE_PATH%/}" = "$BASE_PATH" ]; then
            BASE_PATH="${BASE_PATH}/"
          fi
          npm --prefix marketing-site run build -- --base "$BASE_PATH"

      - name: Create static legal and support routes
        run: |
          mkdir -p marketing-site/dist/privacy marketing-site/dist/support
          cp marketing-site/dist/index.html marketing-site/dist/privacy/index.html
          cp marketing-site/dist/index.html marketing-site/dist/support/index.html

      - name: Build Starlight docs
        run: |
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"
          fi
          if [ "${BASE_PATH%/}" = "$BASE_PATH" ]; then
            BASE_PATH="${BASE_PATH}/"
          fi
          DOCS_BASE="${BASE_PATH}docs/"
          npm --prefix docs run build -- --base "$DOCS_BASE"

      - name: Copy docs into Pages artifact
        run: |
          mkdir -p marketing-site/dist/docs
          cp -R docs/dist/. marketing-site/dist/docs/

      - name: Publish game-package import fixtures
        run: |
          FIXTURE_DIR="docs/scanner-system/examples/codex-critters"
          MANIFEST="$FIXTURE_DIR/codex-critters.game-package.json"
          CATALOG="$FIXTURE_DIR/codex-critters.catalog.json"
          EXPECTED_BYTES="$(jq -r '.catalog.asset.bytes' "$MANIFEST")"
          EXPECTED_SHA="$(jq -r '.catalog.asset.sha256' "$MANIFEST")"
          ACTUAL_BYTES="$(wc -c < "$CATALOG" | tr -d ' ')"
          ACTUAL_SHA="$(sha256sum "$CATALOG" | cut -d ' ' -f 1)"
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          mkdir -p marketing-site/dist/game-packages/codex-critters
          cp "$MANIFEST" marketing-site/dist/game-packages/codex-critters/manifest.json
          cp "$CATALOG" marketing-site/dist/game-packages/codex-critters/codex-critters.catalog.json

      - name: Build frontend demo (static export)
        env:
          NEXT_PUBLIC_CATALOG_BASE_URL: https://assets.tcger.ahmadjalil.com/catalogs
          NEXT_PUBLIC_PACK_ASSET_BASE_URL: https://assets.tcger.ahmadjalil.com
          NEXT_PUBLIC_SCAN_INDEX_BASE_URL: https://assets.tcger.ahmadjalil.com/scan-index
        run: |
          BASE_PATH="${{ steps.pages.outputs.base_path }}"
          if [ -z "$BASE_PATH" ]; then
            BASE_PATH=""
          fi
          # Remove trailing slash for Next.js basePath (must not end with /)
          BASE_PATH="${BASE_PATH%/}"
          DEMO_EXPORT=true BASE_PATH="$BASE_PATH" npm --prefix frontend run build:demo

      - name: Copy demo pages into Pages artifact
        run: |
          cp -R frontend/out/demo marketing-site/dist/demo
          cp -R frontend/out/_next marketing-site/dist/_next
          cp -R frontend/out/icons marketing-site/dist/icons
          cp -R frontend/out/card-backs marketing-site/dist/card-backs
          cp frontend/out/manifest.webmanifest marketing-site/dist/manifest.webmanifest
          cp frontend/out/pwa-192.png marketing-site/dist/pwa-192.png
          cp frontend/out/pwa-192-maskable.png marketing-site/dist/pwa-192-maskable.png
          cp frontend/out/pwa-512.png marketing-site/dist/pwa-512.png
          cp frontend/out/pwa-512-maskable.png marketing-site/dist/pwa-512-maskable.png

      - name: Verify demo runtime files
        run: |
          test -f marketing-site/dist/.well-known/apple-app-site-association
          test -f marketing-site/dist/privacy/index.html
          test -f marketing-site/dist/support/index.html
          test -f marketing-site/dist/manifest.webmanifest
          test -f marketing-site/dist/pwa-192.png
          test -f marketing-site/dist/pwa-512.png
          test -f marketing-site/dist/card-backs/pokemon.png
          test -f marketing-site/dist/card-backs/magic.png
          test -f marketing-site/dist/card-backs/yugioh.png
          test -f marketing-site/dist/card-backs/dragonball.jpg
          test -f marketing-site/dist/card-backs/onepiece.jpg
          test -f marketing-site/dist/card-backs/lorcana.png
          test -f marketing-site/dist/game-packages/codex-critters/manifest.json
          test -f marketing-site/dist/game-packages/codex-critters/codex-critters.catalog.json
          test -f marketing-site/dist/demo/sets/magic/MH2/index.txt
          test -f marketing-site/dist/demo/sets/magic/STA/index.txt
          test -f marketing-site/dist/demo/sets/yugioh/LOB/index.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: marketing-site/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
