name: Web and Android verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile-apps/android/**"
      - "!mobile-apps/android/**/*.md"
      - "mobile-apps/ios/**"
      - "!mobile-apps/ios/**/*.md"
      - "frontend/**"
      - "backend/**"
      - "convex-backend/**"
      - "packages/**"
      - "tools/game-packages/**"
      - "tools/catalogs/**"
      - "tools/r2/**"
      - "mobile-parity/**"
      - "tools/mobile-parity/**"
      - "tools/api-contracts/**"
      - "tools/release/**"
      - "backend/jest.config.cjs"
      - "package-lock.json"
      - "package.json"
      - ".github/workflows/mobile-parity.yml"
  push:
    branches: [main]
    paths:
      - "mobile-apps/android/**"
      - "!mobile-apps/android/**/*.md"
      - "mobile-apps/ios/**"
      - "!mobile-apps/ios/**/*.md"
      - "frontend/**"
      - "backend/**"
      - "convex-backend/**"
      - "packages/**"
      - "tools/game-packages/**"
      - "tools/catalogs/**"
      - "tools/r2/**"
      - "mobile-parity/**"
      - "tools/mobile-parity/**"
      - "tools/api-contracts/**"
      - "tools/release/**"
      - "backend/jest.config.cjs"
      - "package-lock.json"
      - "package.json"
      - ".github/workflows/mobile-parity.yml"

permissions:
  contents: read

concurrency:
  group: mobile-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run parity:check
      - run: npm run release:test
      - run: node --test frontend/src/lib/app-links.test.mjs frontend/src/lib/app-associations.test.mjs
      - name: Summarize affected features
        env:
          PARITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if ! git cat-file -e "${PARITY_BASE_REF}^{commit}" 2>/dev/null; then
            PARITY_BASE_REF=HEAD
          fi
          npm --silent run parity:impact -- --base "$PARITY_BASE_REF" >> "$GITHUB_STEP_SUMMARY"

  api-contracts-js:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        env:
          # These suites never execute native ONNX inference; avoid the optional CUDA download.
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Verify web consumers and Express routes
        run: npm run api-contracts:js
      - name: Verify Convex HTTP actions and persistence
        run: npm run api-contracts:convex
      - name: Upload API contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-contracts-js
          path: mobile-parity/results/api
          if-no-files-found: warn

  android-smoke:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # GitHub's cold Android emulator can need substantially longer than
      # Maestro's default driver startup window after the first APK install.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
      MAESTRO_CLI_NO_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Verify Android capability, link and lock regressions
        run: mobile-apps/android/gradlew -p mobile-apps/android testDebugUnitTest --tests '*ServerCapabilityStoreTest' --tests '*AppLinkTest' --tests '*DeviceAppLockStateTest' --no-daemon
      - name: Verify Android API serialization and decoding
        run: npm run api-contracts:android
      - name: Upload Android API evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-contracts-android
          path: |
            mobile-parity/results/api/android.json
            mobile-parity/results/api/android.xml
          if-no-files-found: warn
      - name: Build Android parity APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if mobile-apps/android/gradlew -p mobile-apps/android --no-daemon assembleDebug; then
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Android build failed after $attempt attempts." >&2
              exit 1
            fi
            echo "Android dependency resolution failed; retrying build ($((attempt + 1))/3)." >&2
            sleep "$((attempt * 10))"
          done
      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # android-emulator-runner requires this on GitHub's Linux hosts; without
      # it the emulator silently falls back to software CPU emulation, making
      # both boot and Maestro's on-device driver exceed their timeouts.
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and run Android parity flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PARITY_ANDROID_SKIP_BUILD: "true"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: npm run parity:android
      - name: Upload Android results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-android
          path: mobile-parity/results/android*
          if-no-files-found: warn

  web-smoke:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        env:
          # These suites never execute native ONNX inference; avoid the optional CUDA download.
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - name: Build shared API types
        run: npm --prefix packages/api-types run build
      - name: Install Playwright browsers
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Run authoritative web parity suite
        run: npm run parity:web
      - name: Upload web results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-web
          path: mobile-parity/results/web*
          if-no-files-found: warn
      - name: Upload Playwright traces and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-artifacts
          path: frontend/test-results
          if-no-files-found: ignore

  report:
    if: always()
    needs: [android-smoke, web-smoke, api-contracts-js]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download platform results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: parity-*
          path: mobile-parity/results
          merge-multiple: true
      - name: Require web and Android UI evidence (iOS runs locally)
        run: |
          parity_exit=0
          npm run parity:report -- --require-platforms web,android || parity_exit=$?
          cat mobile-parity/results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          exit "$parity_exit"
      - name: Download API contract evidence
        if: always()
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: api-contracts-*
          path: mobile-parity/results/api
          merge-multiple: true
      - name: Require web, Android and provider API evidence (iOS runs locally)
        if: always()
        run: |
          api_contract_exit=0
          npm --silent run api-contracts:report -- --require-targets web,android,express,convex > mobile-parity/results/api-summary.md || api_contract_exit=$?
          cat mobile-parity/results/api-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$api_contract_exit"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-parity-report
          path: |
            mobile-parity/results/REPORT.md
            mobile-parity/results/web-summary.json
            mobile-parity/results/web.xml
            mobile-parity/results/api/REPORT.md
            mobile-parity/results/api/summary.json
