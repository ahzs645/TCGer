# This workflow builds all TCGer container images for version releases.
# Flux CD watches the immutable main-<timestamp>-<sha> tags and auto-deploys.

name: Build and push container images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ahzs645

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: tcger-convex-backend
            dockerfile: docker/convex-backend.Dockerfile
            target: deploy
          - name: tcger-backend
            dockerfile: docker/backend.Dockerfile
            target: production
          - name: tcger-frontend
            dockerfile: docker/frontend.Dockerfile
            target: production
          - name: tcger-scryfall
            dockerfile: services/scryfall-bulk/Dockerfile
            target: ""
          - name: tcger-ygo
            dockerfile: services/ygo-cache/Dockerfile
            target: ""
          - name: tcger-tcgdex
            dockerfile: services/tcgdex-cache/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download published catalog packs
        if: matrix.name == 'tcger-backend'
        run: npm run catalogs:download

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          TIMESTAMP=$(date +%s)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version_tag=main-${TIMESTAMP}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate release and deployment tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.tags.outputs.version_tag }}
            type=ref,event=tag
            type=raw,value=main

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_TAG=${{ steps.tags.outputs.version_tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
